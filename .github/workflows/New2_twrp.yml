name: Building TWRP for POCO C40

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-11
    paths-ignore:
      - 'README.md'

env:
  MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-11
  DEVICE: frost
  DT_LINK: https://github.com/Fakezay/twrp_device_xiaomi_frost
  DT_PATH: device/xiaomi/frost
  TARGET: bootimage
  TZ: America/Sao_Paulo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Actions Workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
          x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc \
          ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libwxgtk3.2-dev \
          libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-12-dev libncurses6 python3
        git config --global user.name "Fakezay"
        git config --global user.email "fakezay@users.noreply.github.com"
        
    - name: Install OpenJDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'
 
    - name: Install Google repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sync recovery source
      run: |
        export PATH=~/bin:$PATH
        mkdir -p twrp && cd twrp
        repo init -u $MANIFEST --depth=1
        repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
        rm -rf .repo
             
    - name: Checkout device tree into AOSP source tree
      uses: actions/checkout@v4
      with:
        path: twrp/device/xiaomi/frost

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
       swap-size-gb: 12

    - name: Compile TWRP Boot Image
      run: |
        export PATH=~/bin:$PATH
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true 
        export LC_ALL=C
        source build/envsetup.sh 
        lunch twrp_frost-eng 
        mka bootimage -j$(nproc --all)
        cp out/target/product/frost/boot.img out/target/product/frost/boot-frost-TWRP-Fakezay-$(date +"%Y%m%d").img  
             
    - name: Release TWRP Recovery Image
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: TWRP-3.7-frost-Fakezay
        name: TWRP 3.7.0 for POCO C40 (frost) by Fakezay
        files: | 
          twrp/out/target/product/frost/*boot*.img
